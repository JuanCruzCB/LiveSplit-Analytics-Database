# Note: The paths use forward slashes (/) instead of backslashes (\) to avoid escape character issues.

main_runner:
    name: runner1
    splits_file: 'C:/Path/To/my splits.lss'

other_runners:
    names:
        - runner2
        - runner3
    splits_folder: 'C:/Path/To/Other runners splits'

google_api:
    service_account_secrets_file: 'C:/Path/To/My/service_account_secrets.json'  # Can be left empty
    google_sheet_id: my-google-sheet-id                                         # Can be left empty
    google_drive_folder_id: my-google-drive-folder-id                           # Can be left empty

local_database:
    dbname: postgres
    user: postgres
    host: localhost
    password: 123
    port: 5432

sql_scripts:
    builder: '../sql scripts/splits_database_builder.sql'
    config: '../sql scripts/config.sql'

exclude_data_before: 2020-01-28 # Format must be YYYY-MM-DD. Can be left empty
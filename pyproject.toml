[project]
name = "automated-livesplit-stats-sheet"
version = "0.1.0"
description = "Project that downloads LiveSplit files off Google Drive, updates a local database, and posts the resulting data on a Google Sheet."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gspread>=6.2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "psycopg2>=2.9.10",
    "pydrive>=1.3.1",
    "pydrive2>=1.21.3",
    "python-dotenv>=1.1.0",
]
